<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TeamPickr password reset">
  <title>TeamPickr - Reset your password</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <h1 class="page-title">Reset your password</h1>
    </header>

    <main class="page-main">
      <!-- Loading / redirect state -->
      <div id="token-found">
        <p>We’re opening TeamPickr so you can set a new password…</p>
        <p>
          <a id="open-app-link">If nothing happens, open the app</a>.
        </p>
      </div>

      <!-- Error state -->
      <div id="token-not-found" hidden>
        <p>Invalid password reset link. Missing token.</p>
        <p>
          <a href="teampickr://login">Return to the app</a>
        </p>
      </div>
    </main>
  </div>

  <script>
    (function () {
      // Get token from URL
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      const tokenFound = document.getElementById('token-found');
      const tokenNotFound = document.getElementById('token-not-found');
      const openAppLink = document.getElementById('open-app-link');

      // If token missing → show error
      if (!token) {
        tokenFound.hidden = true;
        tokenNotFound.hidden = false;
        return;
      }

      // Build deep link into app
      const deepLink = `teampickr://reset-password?token=${encodeURIComponent(token)}`;

      // Set fallback link
      openAppLink.href = deepLink;

      // Attempt automatic redirect
      window.location.href = deepLink;
    })();
  </script>
</body>
</html>
