<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TeamPickr email verification">
  <title>TeamPickr - Verify your email</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">

  <style>
    .stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .page-main {
      max-width: 40rem;
      margin: 0 auto;
    }

    .action-link {
      display: inline-block;
    }

    .helper-text {
      opacity: 0.85;
    }

    .message-error {
      color: var(--color-error);
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <h1 class="page-title">Verify your email</h1>
    </header>

    <main class="page-main">
      <noscript>
        <style>#auth-flow { display: none !important; }</style>
        <div class="stack">
          <p>JavaScript is required to verify your email on this page.</p>
          <p><a href="./support.html">Support</a></p>
        </div>
      </noscript>
      <div id="auth-flow" class="stack">
        <section id="loading-state">
          <p>Verifying your email…</p>
        </section>

        <section id="success-state" hidden>
          <p>Your email address is verified.</p>
          <p>
            <a class="action-link" href="teampickr://">Open TeamPickr</a>
            <span class="helper-text"> if you use the app on this device.</span>
          </p>
        </section>

        <section id="error-state" hidden>
          <p id="error-message" class="message-error" role="alert"></p>
          <p>
            <a class="action-link" href="./support.html">Contact support</a>
            <span class="helper-text"> if you need help.</span>
          </p>
        </section>

        <section id="token-not-found" hidden>
          <p>Invalid link. Missing verification token.</p>
          <p>
            <a class="action-link" href="teampickr://">Open TeamPickr</a>
            <span class="helper-text"> or request a new verification email from the app.</span>
          </p>
        </section>
      </div>
    </main>
  </div>

  <script type="module">
    import {
      createClient,
      getTokenFromUrl,
      formatAuthError,
      AUTH_COLLECTION,
    } from './auth-bridge.js';

    const loadingState = document.getElementById('loading-state');
    const successState = document.getElementById('success-state');
    const errorState = document.getElementById('error-state');
    const errorMessage = document.getElementById('error-message');
    const tokenNotFound = document.getElementById('token-not-found');

    function show(el) {
      loadingState.hidden = true;
      successState.hidden = true;
      errorState.hidden = true;
      tokenNotFound.hidden = true;
      el.hidden = false;
    }

    const token = getTokenFromUrl();
    if (!token) {
      show(tokenNotFound);
    } else {
      const pb = createClient();
      try {
        await pb.collection(AUTH_COLLECTION).confirmVerification(token);
        show(successState);
      } catch (err) {
        errorMessage.textContent = formatAuthError(err);
        show(errorState);
      }
    }
  </script>
</body>
</html>
